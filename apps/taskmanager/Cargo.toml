[package]
name = "taskmgr"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "taskmgr-desktop"
path = "src/main.rs"

[dependencies]
heartnet-kit = { path = "../../crates/heartnet-kit" }
adbwire = { path = "../../crates/adbwire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
log = "0.4.34"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
android_logger = "0.15.1"
jni = "0.21"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
