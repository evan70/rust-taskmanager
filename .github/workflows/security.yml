name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories are published continuously; the weekly run checks the lockfiles without a push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # audit-check reports the result through a check run, so `checks: write` is not optional: without
      # it the action dies with "Resource not accessible by integration" instead of failing the job.
      checks: write
      # …and on the weekly run it files an issue about what it found.
      issues: write
    steps:
      - uses: actions/checkout@v4

      # One invocation audits one lockfile, and the helper is its own workspace, so it needs its own
      # step. `.cargo/audit.toml` holds the advisories that are knowingly accepted, each with its
      # reason, and is read by a plain `cargo audit` too.
      - name: Check Cargo.lock against the RustSec advisory database
        # No floating `v2` tag exists for this action: it has to be pinned exactly.
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check helper/Cargo.lock against the RustSec advisory database
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: helper

  dependency-review:
    name: dependency review
    # This action only has a diff to look at on pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Reject pull requests that add a vulnerable dependency
        uses: actions/dependency-review-action@v4
